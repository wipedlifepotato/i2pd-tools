name: 🔍 Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  lint-cpp:
    name: 🔍 C++ Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: 🔧 Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libboost-all-dev libssl-dev zlib1g-dev clang-tidy cppcheck

    - name: 🔍 Run cppcheck
      run: |
        echo "Running cppcheck..."
        cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem \
          --suppress=unusedFunction --suppress=unmatchedSuppression \
          *.cpp || echo "cppcheck found issues (non-fatal)"

    - name: 🔍 Run clang-tidy
      run: |
        echo "Running clang-tidy..."
        # Create compile_commands.json for clang-tidy
        make clean || true
        make CXXFLAGS="-g -O0" 2>&1 | tee compile.log || true
        
        # Run clang-tidy on source files
        find . -name "*.cpp" -not -path "./i2pd/*" -exec clang-tidy {} -- -I./i2pd/libi2pd -I./i2pd/libi2pd_client -std=c++17 \; || echo "clang-tidy found issues (non-fatal)"

  check-formatting:
    name: 📝 Code Formatting
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: 🔧 Install clang-format
      run: |
        sudo apt update
        sudo apt install -y clang-format

    - name: 📝 Check C++ formatting
      run: |
        echo "Checking C++ code formatting..."
        find . -name "*.cpp" -not -path "./i2pd/*" -exec clang-format --dry-run --Werror {} \; || echo "Formatting issues found (non-fatal)"

    - name: 📝 Check header formatting
      run: |
        echo "Checking header file formatting..."
        find . -name "*.h" -not -path "./i2pd/*" -exec clang-format --dry-run --Werror {} \; || echo "Header formatting issues found (non-fatal)"

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: 🔧 Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libboost-all-dev libssl-dev zlib1g-dev

    - name: 🔒 Run security scan with cppcheck
      run: |
        echo "Running security-focused cppcheck..."
        cppcheck --enable=warning,style,performance,portability,information,unusedFunction,missingInclude \
          --error-exitcode=1 --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression --force \
          *.cpp || echo "Security issues found (non-fatal)"

  dependency-check:
    name: 📦 Dependency Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: 🔧 Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libboost-all-dev libssl-dev zlib1g-dev

    - name: 📦 Check for outdated dependencies
      run: |
        echo "Checking for outdated dependencies..."
        echo "## 📦 Dependency Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### System Dependencies:" >> $GITHUB_STEP_SUMMARY
        echo "- Boost: $(pkg-config --modversion boost || echo 'Not found')" >> $GITHUB_STEP_SUMMARY
        echo "- OpenSSL: $(pkg-config --modversion openssl || echo 'Not found')" >> $GITHUB_STEP_SUMMARY
        echo "- Zlib: $(pkg-config --modversion zlib || echo 'Not found')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Submodules:" >> $GITHUB_STEP_SUMMARY
        git submodule status | while read line; do
          echo "- $(echo $line | awk '{print $2}')" >> $GITHUB_STEP_SUMMARY
        done

  build-size-check:
    name: 📏 Build Size Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: 🔧 Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libboost-all-dev libssl-dev zlib1g-dev

    - name: 🔨 Build tools
      run: make

    - name: 📏 Check binary sizes
      run: |
        echo "## 📏 Binary Size Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Tool | Size |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        
        for tool in autoconf b33address famtool i2pbase64 keygen keyinfo offlinekeys regaddr regaddr_3ld regaddralias routerinfo vain verifyhost x25519; do
          if [ -f "$tool" ]; then
            size=$(ls -lh "$tool" | awk '{print $5}')
            echo "| $tool | $size |" >> $GITHUB_STEP_SUMMARY
          fi
        done
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Total Size:" >> $GITHUB_STEP_SUMMARY
        total_size=$(du -sh . | awk '{print $1}')
        echo "- All binaries: $total_size" >> $GITHUB_STEP_SUMMARY

    - name: 🔨 Build stripped version
      run: make stripall

    - name: 📏 Check stripped binary sizes
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Stripped Binaries:" >> $GITHUB_STEP_SUMMARY
        echo "| Tool | Stripped Size |" >> $GITHUB_STEP_SUMMARY
        echo "|------|---------------|" >> $GITHUB_STEP_SUMMARY
        
        for tool in autoconf b33address famtool i2pbase64 keygen keyinfo offlinekeys regaddr regaddr_3ld regaddralias routerinfo vain verifyhost x25519; do
          if [ -f "$tool" ]; then
            size=$(ls -lh "$tool" | awk '{print $5}')
            echo "| $tool | $size |" >> $GITHUB_STEP_SUMMARY
          fi
        done
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Total Stripped Size:" >> $GITHUB_STEP_SUMMARY
        total_size=$(du -sh . | awk '{print $1}')
        echo "- All stripped binaries: $total_size" >> $GITHUB_STEP_SUMMARY

  quality-summary:
    name: 📊 Quality Summary
    runs-on: ubuntu-latest
    needs: [lint-cpp, check-formatting, security-scan, dependency-check, build-size-check]
    if: always()
    
    steps:
    - name: 📊 Quality Report
      run: |
        echo "## 🔍 Code Quality Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.lint-cpp.result }}" = "success" ]; then
          echo "| 🔍 C++ Linting | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| 🔍 C++ Linting | ⚠️ Issues Found |" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.check-formatting.result }}" = "success" ]; then
          echo "| 📝 Code Formatting | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| 📝 Code Formatting | ⚠️ Issues Found |" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.security-scan.result }}" = "success" ]; then
          echo "| 🔒 Security Scan | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| 🔒 Security Scan | ⚠️ Issues Found |" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.dependency-check.result }}" = "success" ]; then
          echo "| 📦 Dependency Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| 📦 Dependency Check | ⚠️ Issues Found |" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.build-size-check.result }}" = "success" ]; then
          echo "| 📏 Build Size Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| 📏 Build Size Check | ⚠️ Issues Found |" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Recommendations:" >> $GITHUB_STEP_SUMMARY
        echo "- Review any warnings or issues found by the linters" >> $GITHUB_STEP_SUMMARY
        echo "- Consider using clang-format to maintain consistent code style" >> $GITHUB_STEP_SUMMARY
        echo "- Monitor binary sizes to ensure they remain reasonable" >> $GITHUB_STEP_SUMMARY
        echo "- Keep dependencies up to date for security" >> $GITHUB_STEP_SUMMARY
