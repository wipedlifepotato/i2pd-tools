name: 🧪 Test i2pd-tools

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test-tools:
    name: 🔍 Test Tools Functionality
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: 🔧 Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libboost-all-dev libssl-dev zlib1g-dev

    - name: 🔨 Build tools
      run: make

    - name: 🧪 Test keygen tool
      run: |
        echo "Testing keygen..."
        ./keygen test_key.dat
        if [ -f "test_key.dat" ]; then
          echo "✅ keygen: Key file created successfully"
        else
          echo "❌ keygen: Key file not created"
          exit 1
        fi

    - name: 🧪 Test keyinfo tool
      run: |
        echo "Testing keyinfo..."
        if [ -f "test_key.dat" ]; then
          ./keyinfo test_key.dat > keyinfo_output.txt
          if [ -s "keyinfo_output.txt" ]; then
            echo "✅ keyinfo: Output generated successfully"
            cat keyinfo_output.txt
          else
            echo "❌ keyinfo: No output generated"
            exit 1
          fi
        else
          echo "❌ keyinfo: No key file to test with"
          exit 1
        fi

    - name: 🧪 Test i2pbase64 tool
      run: |
        echo "Testing i2pbase64..."
        echo "test" | ./i2pbase64 > base64_output.txt
        if [ -s "base64_output.txt" ]; then
          echo "✅ i2pbase64: Encoding works"
          cat base64_output.txt
          
          # Test decoding
          cat base64_output.txt | ./i2pbase64 -d > decoded_output.txt
          if [ -s "decoded_output.txt" ]; then
            echo "✅ i2pbase64: Decoding works"
            cat decoded_output.txt
          else
            echo "❌ i2pbase64: Decoding failed"
            exit 1
          fi
        else
          echo "❌ i2pbase64: No output generated"
          exit 1
        fi

    - name: 🧪 Test x25519 tool
      run: |
        echo "Testing x25519..."
        ./x25519 > x25519_output.txt
        if [ -s "x25519_output.txt" ]; then
          echo "✅ x25519: Key generation works"
          cat x25519_output.txt
        else
          echo "❌ x25519: No output generated"
          exit 1
        fi

    - name: 🧪 Test vain tool (short test)
      run: |
        echo "Testing vain (short test)..."
        timeout 10s ./vain test || true
        echo "✅ vain: Tool runs (timeout expected for short test)"

    - name: 🧪 Test autoconf tool
      run: |
        echo "Testing autoconf..."
        ./autoconf --help > autoconf_help.txt || true
        if [ -f "autoconf_help.txt" ]; then
          echo "✅ autoconf: Help option works"
          cat autoconf_help.txt
        else
          echo "⚠️ autoconf: Help option not available, but tool exists"
        fi

    - name: 🧪 Test famtool tool
      run: |
        echo "Testing famtool..."
        ./famtool --help > famtool_help.txt || true
        if [ -f "famtool_help.txt" ]; then
          echo "✅ famtool: Help option works"
          cat famtool_help.txt
        else
          echo "⚠️ famtool: Help option not available, but tool exists"
        fi

    - name: 🧪 Test routerinfo tool
      run: |
        echo "Testing routerinfo..."
        ./routerinfo --help > routerinfo_help.txt || true
        if [ -f "routerinfo_help.txt" ]; then
          echo "✅ routerinfo: Help option works"
          cat routerinfo_help.txt
        else
          echo "⚠️ routerinfo: Help option not available, but tool exists"
        fi

    - name: 🧪 Test regaddr tool
      run: |
        echo "Testing regaddr..."
        ./regaddr --help > regaddr_help.txt || true
        if [ -f "regaddr_help.txt" ]; then
          echo "✅ regaddr: Help option works"
          cat regaddr_help.txt
        else
          echo "⚠️ regaddr: Help option not available, but tool exists"
        fi

    - name: 🧪 Test verifyhost tool
      run: |
        echo "Testing verifyhost..."
        ./verifyhost --help > verifyhost_help.txt || true
        if [ -f "verifyhost_help.txt" ]; then
          echo "✅ verifyhost: Help option works"
          cat verifyhost_help.txt
        else
          echo "⚠️ verifyhost: Help option not available, but tool exists"
        fi

    - name: 📊 Test Summary
      run: |
        echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Successfully Tested Tools:" >> $GITHUB_STEP_SUMMARY
        echo "- keygen: Key generation" >> $GITHUB_STEP_SUMMARY
        echo "- keyinfo: Key information display" >> $GITHUB_STEP_SUMMARY
        echo "- i2pbase64: Base64 encoding/decoding" >> $GITHUB_STEP_SUMMARY
        echo "- x25519: X25519 key generation" >> $GITHUB_STEP_SUMMARY
        echo "- vain: Vanity address generation (basic test)" >> $GITHUB_STEP_SUMMARY
        echo "- autoconf: Configuration helper" >> $GITHUB_STEP_SUMMARY
        echo "- famtool: Family router tools" >> $GITHUB_STEP_SUMMARY
        echo "- routerinfo: Router information" >> $GITHUB_STEP_SUMMARY
        echo "- regaddr: Domain registration" >> $GITHUB_STEP_SUMMARY
        echo "- verifyhost: Host verification" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📁 Test Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "- test_key.dat: Generated test key" >> $GITHUB_STEP_SUMMARY
        echo "- keyinfo_output.txt: Key information output" >> $GITHUB_STEP_SUMMARY
        echo "- base64_output.txt: Base64 encoding output" >> $GITHUB_STEP_SUMMARY
        echo "- decoded_output.txt: Base64 decoding output" >> $GITHUB_STEP_SUMMARY
        echo "- x25519_output.txt: X25519 key output" >> $GITHUB_STEP_SUMMARY
        echo "- *_help.txt: Help outputs from various tools" >> $GITHUB_STEP_SUMMARY

    - name: 🧹 Cleanup test files
      if: always()
      run: |
        rm -f test_key.dat keyinfo_output.txt base64_output.txt decoded_output.txt x25519_output.txt
        rm -f autoconf_help.txt famtool_help.txt routerinfo_help.txt regaddr_help.txt verifyhost_help.txt

  test-cross-platform:
    name: 🌐 Cross-Platform Compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          # Windows doesn't have gcc by default
          - os: windows-latest
            compiler: gcc
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: 🔧 Setup Windows
      if: ${{ matrix.os == 'windows-latest' }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        install: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel mingw-w64-x86_64-toolchain
          pacman -S --noconfirm mingw-w64-x86_64-boost
          pacman -S --noconfirm mingw-w64-x86_64-openssl
          pacman -S --noconfirm mingw-w64-x86_64-zlib
          pacman -S --noconfirm make

    - name: 🔧 Setup Linux
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt update
        sudo apt install -y build-essential libboost-all-dev libssl-dev zlib1g-dev
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt install -y clang
        fi

    - name: 🔧 Setup macOS
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        brew install boost openssl zlib
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          brew install gcc
        fi

    - name: 🔨 Build tools
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            make CXX=clang++
          else
            make CXX=g++
          fi
        else
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            make CXX=clang++
          else
            make CXX=g++
          fi
        fi

    - name: 📊 Verify build
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          echo "Built tools:"
          ls -la *.exe
          echo "Total: $(ls -1 *.exe | wc -l) tools"
        else
          echo "Built tools:"
          ls -la | grep -E '^[a-zA-Z0-9_-]+$' | grep -v '\.'
          echo "Total: $(ls -1 | grep -E '^[a-zA-Z0-9_-]+$' | grep -v '\.' | wc -l) tools"
        fi
