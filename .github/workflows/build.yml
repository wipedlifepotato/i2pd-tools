name: Build and Cross-compile

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [clang]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      #######################
      # Ubuntu dependencies #
      #######################
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install --no-install-recommends -y build-essential libboost-all-dev libssl-dev git

      - name: Cache build artifacts (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v3
        with:
          path: |
            obj
            libi2pd.a
          key: ubuntu-build-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.h') }}

      #########################
      # Windows dependencies  #
      #########################
      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-miniupnpc

      - name: Initialize Git Submodules
        run: git submodule update --init --recursive

      ###################
      # Build on Ubuntu #
      ###################
      - name: Build Project (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          make -j8
          make stripall
          make builddir

      ####################
      # Build on Windows #
      ####################
      - name: Build Project (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          cd "${GITHUB_WORKSPACE}"
          export CC=clang
          export CXX=clang++
          make -j$(nproc)
          make stripall
          make builddir

      #########################
      # Upload build artifacts#
      #########################
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: my-binaries-${{ matrix.os }}
          path: build/*

